<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090A1A" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGlow)"/>

  <!-- Halo Aura -->
  <circle cx="540" cy="850" r="420" fill="url(#bulbGlow)"/>

  <!-- Light Bulb Illustration -->
  <g filter="url(#glow)">
    <!-- Glass Bulb Shape -->
    <path d="M 540,520 C 410,520 330,620 330,750 C 330,860 410,950 440,1030 L 440,1110 L 640,1110 L 640,1030 C 670,950 750,860 750,750 C 750,620 670,520 540,520 Z" 
          fill="rgba(254, 240, 138, 0.25)" 
          stroke="#FDE047" 
          stroke-width="8"/>
    
    <!-- Inner Glowing Filament -->
    <path d="M 480,950 L 500,780 L 520,720 L 540,780 L 560,720 L 580,780 L 600,950" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Metallic Base -->
  <rect x="440" y="1110" width="200" height="30" rx="10" fill="#94A3B8" stroke="#475569" stroke-width="4"/>
  <rect x="445" y="1150" width="190" height="30" rx="10" fill="#64748B" stroke="#334155" stroke-width="4"/>
  <rect x="450" y="1190" width="180" height="30" rx="10" fill="#475569" stroke="#1E293B" stroke-width="4"/>
  <path d="M 470,1230 C 470,1270 610,1270 610,1230 Z" fill="#0F172A"/>

  <!-- Floating Sparkles -->
  <circle cx="280" cy="650" r="6" fill="#FDE047"/>
  <circle cx="800" cy="720" r="8" fill="#FDE047"/>
  <circle cx="740" cy="580" r="5" fill="#FFFFFF"/>
  <circle cx="320" cy="880" r="7" fill="#FFFFFF"/>
</svg>
